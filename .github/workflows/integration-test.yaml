name: integration test
run-name: e2e ${{ github.event_name == 'schedule' && 'nightly' || github.head_ref || github.ref_name }}

on:
  pull_request:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
jobs:
  integration-test:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    strategy:
      fail-fast: false
      matrix:
        agent: [ubuntu-latest, windows-latest, macos-latest]
        category: [InitCommand, SingleTestProject, MultipleTestProjects, Solution, MSTestMTP, XUnitMTP, NUnitMTP, TUnit, MTPSolution, WebApiWithOpenApi]
        runtime: [netcore, netframework]
        exclude:
          - runtime: netframework
            agent: ubuntu-latest
          - runtime: netframework
            agent: macos-latest
          - runtime: netframework
            category: InitCommand
          - runtime: netframework
            category: MultipleTestProjects
          - runtime: netframework
            category: MSTestMTP
          - runtime: netframework
            category: XUnitMTP
          - runtime: netframework
            category: NUnitMTP
          - runtime: netframework
            category: TUnit
          - runtime: netframework
            category: MTPSolution
          - runtime: netframework
            category: WebApiWithOpenApi
    runs-on: ${{ matrix.agent }}
    env:
      CATEGORY: ${{ matrix.category }}
      RUNTIME: ${{ matrix.runtime }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.x
      - name: Run integration tests
        shell: pwsh
        run: ./integration-tests.ps1

      - name: Validate MTP cancellation and host reuse
        if: matrix.category == 'MSTestMTP' && matrix.runtime == 'netcore'
        shell: pwsh
        run: |
          dotnet restore ./src/Stryker.TestRunner.MicrosoftTestPlatform.UnitTest/Stryker.TestRunner.MicrosoftTestPlatform.UnitTest.csproj --locked-mode
          if ($LASTEXITCODE -ne 0) { throw "MTP unit-host restore failed." }
          ./integrationtest/TargetProjects/MicrosoftTestPlatform/Cancellation/run-validation.ps1 -EvidencePath ./publish/mtp-cancellation

      - name: Upload MTP cancellation evidence
        if: always() && matrix.category == 'MSTestMTP' && matrix.runtime == 'netcore'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: mtp-cancellation-${{ matrix.agent }}
          path: publish/mtp-cancellation

  # Fan-in job that depends on all matrix combinations
  # This job can be used as a single required check in PR rules
  integration-test-complete:
    name: Integration Tests Complete
    runs-on: ubuntu-latest
    needs: integration-test
    if: always()
    steps:
      - name: Check integration test results
        run: |
          if [ "${{ needs.integration-test.result }}" != "success" ]; then
            echo "Integration tests failed or were cancelled"
            exit 1
          fi
          echo "All integration tests passed successfully"
